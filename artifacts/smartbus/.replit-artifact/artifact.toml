kind = "web"
previewPath = "/"
title = "SmartBus AI"
version = "1.0.0"
id = "artifacts/smartbus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19337

[services.development]
run = "pnpm --filter @workspace/smartbus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartbus", "run", "build" ]
publicDir = "artifacts/smartbus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19337"
BASE_PATH = "/"
