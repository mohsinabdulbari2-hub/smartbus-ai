kind = "mobile"
previewPath = "/mobile/"
title = "SmartBus AI Mobile"
version = "1.0.0"
id = "artifacts/smartbus-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19356

[services.development]
run = "pnpm --filter @workspace/smartbus-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartbus-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/smartbus-mobile", "run", "serve" ]

[services.env]
PORT = "19356"
BASE_PATH = "/mobile/"
